<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Jaana 💕</title>

<style>
:root {
    --bg: #171516;
    --rose: #e7a6b5;
    --soft: #f1dfe3;
    --gold: #d7b58a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
    radial-gradient(
        ellipse at 50% 38%,
        rgba(125,65,83,.22),
        transparent 48%
    ),
    #171516;

    color: var(--soft);
    font-family: Georgia, serif;
}

.page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 30px 20px;
    position: relative;
}

.content {
    width: min(100%,760px);
    text-align: center;
    animation: arrive 1.5s ease both;
}

.eyebrow {
    font-size: .72rem;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 32px;
}

.butterfly {
    font-size: 2.2rem;
    display: inline-block;
    margin-bottom: 18px;
    animation: float 4s ease-in-out infinite;
}

h1 {
    font-weight: 400;
    font-size: clamp(3.2rem,10vw,6.7rem);
    line-height: 1.05;
    color: #f5e9eb;
}

h1 span {
    display: block;
    color: var(--rose);
    font-family: "Segoe Script",
                 "Brush Script MT",
                 cursive;
    font-style: italic;
}

.rule {
    width: 64px;
    height: 1px;
    margin: 30px auto 25px;
    background: var(--gold);
}

.intro {
    font-size: clamp(1rem,2.6vw,1.22rem);
    line-height: 1.85;
    color: #d0c4c8;
    max-width: 560px;
    margin: auto;
}

.intro em {
    color: #f0c5cf;
}

.cta {
    margin-top: 42px;
    display: inline-flex;
    align-items: center;
    gap: 15px;
    padding: 15px 25px;

    border: 1px solid rgba(231,166,181,.48);
    border-radius: 999px;

    color: #f5e4e8;
    text-decoration: none;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: .72rem;

    transition: .35s ease;
}

.cta:hover {
    background: rgba(231,166,181,.10);
    transform: translateY(-3px);
}

.foot {
    position: absolute;
    bottom: 24px;
    text-align: center;
    width: 100%;
    color: #80757a;
    font-size: .68rem;
    letter-spacing: .18em;
}

@keyframes arrive {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(-4deg);
    }
    50% {
        transform: translateY(-9px) rotate(4deg);
    }
}

@media(max-width:520px) {
    .intro {
        line-height: 1.75;
    }
}
</style>
</head>

<body>

<main class="page">

<section class="content">

    <div class="eyebrow">
        A little place made of memories
    </div>

    <div class="butterfly">🦋</div>

    <h1>
        For my
        <span>Jaana</span>
    </h1>

    <div class="rule"></div>

    <p class="intro">
        Some people become part of our story.
        And some become
        <em>the stories we carry</em> —
        in little moments, familiar places,
        and memories that still feel close.
    </p>

    <a class="cta" href="CH%201.html">
        Step into our story →
    </a>

    <p>A journey called us · since March 2022</p>

</section>

<div class="foot">
    Made with love, for Jaana ♡
</div>

</main>

</body>
</html>
